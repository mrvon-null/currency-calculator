services:
  postgresdb1:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5435:5432'
  app:
    build:
      context: ./curcalc
    ports:
      - '8080:8080'
    environment:
      DB_PORT: 5432
      DB_URL: postgresdb1
    depends_on:
      - postgresdb1
